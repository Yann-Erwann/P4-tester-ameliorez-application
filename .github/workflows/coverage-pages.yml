name: Publish coverage reports

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/coverage-pages.yml
      - .github/pages/coverage-index.html
      - .github/pages/coverage-releases.sha256
  workflow_dispatch:

permissions: {}

concurrency:
  group: coverage-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Download the listed release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/coverage-downloads"
          cd "$RUNNER_TEMP/coverage-downloads"
          while read -r _ archive; do
            version=${archive%/*}
            suite=${archive#*/}
            mkdir -p "$version"
            gh release download "$version" --repo "$GITHUB_REPOSITORY" \
              --pattern "coverage-${suite%.zip}-$version.zip" --output "$archive"
          done < "$GITHUB_WORKSPACE/.github/pages/coverage-releases.sha256"
      - name: Verify all checksums before extracting reports
        shell: bash
        working-directory: ${{ runner.temp }}/coverage-downloads
        run: |
          manifest="$GITHUB_WORKSPACE/.github/pages/coverage-releases.sha256"
          sha256sum --check --strict "$manifest"
          site="$RUNNER_TEMP/coverage-site"
          mkdir "$site"
          while read -r _ archive; do
            report="$site/${archive%.zip}"
            python3 -m zipfile -e "$archive" "$report"
            test -s "$report/index.html"
          done < "$manifest"
          cp "$GITHUB_WORKSPACE/.github/pages/coverage-index.html" "$site/index.html"
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: ${{ runner.temp }}/coverage-site

  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        id: deployment
