name: Publish coverage reports

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/coverage-pages.yml
      - .github/pages/coverage-index.html
  workflow_dispatch:

concurrency:
  group: coverage-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - name: Prepare coverage reports from the releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for version in v0.0.2 v1.0.0 v1.1.0; do
            gh release download "$version" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP" \
              --pattern "coverage-jest-$version.zip" \
              --pattern "coverage-jacoco-$version.zip" \
              --pattern "coverage-cypress-$version.zip"
            for suite in jest jacoco cypress; do
              python3 -m zipfile -e "$RUNNER_TEMP/coverage-$suite-$version.zip" "site/$version/$suite"
              test -s "site/$version/$suite/index.html"
            done
          done
          cp .github/pages/coverage-index.html site/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
